name: Build Windows Package

# 触发：推送 v* 标签时打包并发布；也可在 Actions 页手动触发（验证流水线用）
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  build:
    name: Build win-x64 package
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      PUB: orb/bin/Release/net6.0-windows/win-x64/publish

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 6 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "6.0.x"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python build deps (PyInstaller + psutil)
        run: pip install --upgrade pip pyinstaller psutil

      # 采集端：PyInstaller 单文件 backend.exe（纯本地 API 服务）
      - name: Build backend.exe (PyInstaller)
        run: python build_exe.py

      # 拷到 orb/：csproj 里配了 CopyToPublishDirectory，发布时会落在主程序旁边
      - name: Stage backend next to the shell
        run: cp dist/backend.exe orb/backend.exe

      # WPF 自包含发布：目标机不需要装 .NET
      - name: Publish shell (self-contained win-x64)
        run: dotnet publish orb/ZmdOrb.csproj -c Release -r win-x64 --self-contained true

      # 许可与说明也进发布目录：压缩包是整目录打包，安装包的 [Files] 也指同一个目录
      # （MIT 要求把版权声明随副本一起给；安装包那边的源缺失时有 skipifsourcedoesntexist 兜着）
      - name: Stage LICENSE and README into the publish dir
        run: cp LICENSE README.md "$PUB/"

      # 真跑一次发布产物，确认它能把 backend.exe 拉起来并开始出数
      - name: Smoke test published bundle
        run: |
          ls "$PUB" | head -12
          powershell -NoProfile -Command "Start-Process -FilePath '$PUB/zmd-orb.exe'"
          for i in $(seq 1 25); do
            if curl -s --max-time 2 http://127.0.0.1:8910/health | grep -q zmd-orb-collector; then
              echo "✅ 采集端已就绪，装有快照："
              curl -s http://127.0.0.1:8910/snapshot | head -c 400; echo
              exit 0
            fi
            sleep 1
          done
          echo "❌ 采集端没起来，壳日志："
          cat "$LOCALAPPDATA/Temp/zmd_orb_shell.log" 2>/dev/null || true
          exit 1

      - name: Stop the smoke-test app
        if: always()
        run: taskkill //IM zmd-orb.exe //F || true

      - name: Pack zip
        run: |
          powershell -NoProfile -Command "Compress-Archive -Path '$PUB/*' -DestinationPath 'zmd-orb-win-x64.zip' -Force"
          ls -la zmd-orb-win-x64.zip

      # 安装包（M4）：Inno Setup。版本号取 tag（v1.2.3 → 1.2.3），手动触发时给个 dev 版本。
      # 中文语言包已经随仓库带在 installer/ 下（Inno 官方安装包不带中文，那份是社区翻译）。
      - name: Build installer (Inno Setup)
        run: |
          choco install innosetup --no-progress -y || true
          VER="${GITHUB_REF_NAME#v}"
          case "$GITHUB_REF_NAME" in v*) ;; *) VER="0.0.1-dev" ;; esac
          # /D... 这种参数在 MSYS bash 下会被当成路径改写，必须关掉路径转换
          MSYS_NO_PATHCONV=1 "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" \
            "/DMyAppVersion=$VER" \
            "/DMySourceDir=$(cygpath -w "$PWD/$PUB")" \
            "$(cygpath -w "$PWD/installer/zmd-orb.iss")"
          ls -la dist/

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: zmd-orb-win-x64
          path: |
            zmd-orb-win-x64.zip
            dist/zmd-orb-setup-*.exe
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: |
            zmd-orb-win-x64.zip
            dist/zmd-orb-setup-*.exe
          generate_release_notes: true