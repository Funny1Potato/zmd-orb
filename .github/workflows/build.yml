name: Build Windows Installer

# 触发：推送 v* 标签时构建 NSIS 安装包并发布；也可在 Actions 页手动触发（M0 验证用）
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  PYTHONUNBUFFERED: "1"

jobs:
  build:
    name: Build NSIS Installer (Windows)
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node (for tauri-cli)
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python build deps (PyInstaller + psutil)
        run: pip install --upgrade pip pyinstaller psutil

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tauri/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('tauri/src-tauri/Cargo.lock') }}

      # 采集端：PyInstaller 单文件 backend.exe（纯本地 API 服务，作为 Tauri 资源随安装包落地）
      - name: Build backend.exe (PyInstaller)
        run: python build_exe.py

      # 拷进 src-tauri，使其作为 Tauri 资源（resources 用干净文件名，
      # 避免 "../../" 被 Tauri 编码成 _up_ 导致安装路径错乱、壳层找不到 backend）
      - name: Stage backend into Tauri resources
        run: cp dist/backend.exe tauri/src-tauri/backend.exe

      # Tauri 2 会按需下载 NSIS 工具链与 WebView2 引导器
      - name: Build installer (tauri build --bundles nsis)
        run: |
          cd tauri/src-tauri
          npx -y @tauri-apps/cli@2 build --bundles nsis

      - name: Locate installer
        run: |
          INST=$(ls tauri/src-tauri/target/release/bundle/nsis/*.exe | head -1)
          echo "INSTALLER=$INST" >> "$GITHUB_ENV"
          ls -la "$INST"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: zmd-orb-installer
          path: ${{ env.INSTALLER }}
          if-no-files-found: error

      - name: Create GitHub Release (NSIS installer)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: ${{ env.INSTALLER }}
          generate_release_notes: true