[package]
name = "zmd-orb"
version = "0.0.1"
description = "终末地加速球：悬浮球内存整理 + 任务管理器"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# M0 只用到窗口本身。托盘（tray-icon 特性）与 autostart / single-instance / window-state
# 三个插件留到 M4——壳只能在 CI 编译，能不动的依赖就先不动。
tauri = { version = "2" }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true